<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horários disponíveis</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="phone">
    <header class="topbar">
        <span></span>
        <div class="avatar">👤</div>
    </header>

    <section class="section-title">
        <h1>Horários Disponíveis</h1>
        <a class="circle-btn back" th:href="@{/consultas}">←</a>
    </section>

    <form th:action="@{'/consultas/' + ${consulta.id} + '/remarcar'}" method="post">
        <div class="list">
            <label class="consulta-row selectable" th:each="h : ${horarios}">
                <span th:text="${#temporals.format(h.data, 'dd/MM/yy')}"></span>
                <span th:text="${#temporals.format(h.hora, 'HH:mm')}"></span>
                <span class="doctor" th:text="${h.medico.nome}"></span>
                <input type="radio" name="horarioId" th:value="${h.id}" required>
                <span>☰</span>
            </label>
        </div>

        <div class="bottom-action">
            <button class="btn primary" type="submit">CONFIRMAR NOVO HORÁRIO</button>
        </div>
    </form>
</div>
</body>
</html>
