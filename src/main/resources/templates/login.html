<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Agenda Médica</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="login-body">
<div class="phone login-phone">
    <div class="avatar big">👤</div>

    <form class="login-form" th:action="@{/login}" method="post">
        <input type="text" name="usuario" placeholder="Usuário" required>
        <input type="password" name="senha" placeholder="Senha" required>

        <p class="erro" th:if="${erro}" th:text="${erro}"></p>

        <button class="btn primary" type="submit">LOGIN</button>
        <button class="btn small secondary" type="button"
                onclick="alert('Função de recuperação de senha pode ser implementada depois.')">
            ESQUECI A SENHA
        </button>
    </form>

    <button class="btn small secondary bottom" type="button"
            onclick="alert('Cadastro de usuário será a próxima etapa.')">
        REGISTRAR-SE
    </button>

    <div class="demo-login">
        Usuário de teste: <strong>juzem</strong><br>
        Senha: <strong>1234</strong>
    </div>
</div>
</body>
</html>
