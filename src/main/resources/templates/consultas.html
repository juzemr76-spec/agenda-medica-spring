<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultas</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="phone">
    <header class="topbar">
        <span></span>
        <div class="avatar">👤</div>
    </header>

    <section class="section-title">
        <h1>Consultas</h1>
        <button class="circle-btn" onclick="alert('Cadastro de nova consulta pode ser implementado depois.')">+</button>
    </section>

    <div class="list">
        <div class="consulta-row"
             th:each="c : ${consultas}"
             th:attr="data-id=${c.id},
                      data-medico=${c.medico.nome},
                      data-data=${#temporals.format(c.data, 'dd/MM/yyyy')},
                      data-hora=${#temporals.format(c.hora, 'HH:mm')},
                      data-status=${c.status},
                      data-valor=${c.valor}">
            <span th:text="${#temporals.format(c.data, 'dd/MM/yy')}"></span>
            <span th:text="${#temporals.format(c.hora, 'HH:mm')}"></span>
            <span class="doctor" th:text="${c.medico.nome}"></span>
            <span th:text="${c.status.name() == 'AGENDADO' ? '◷' : (c.status.name() == 'CONCLUIDO' ? '✓' : '✕')}"></span>
            <button class="menu-btn" type="button" onclick="abrirDetalhes(this)">☰</button>
        </div>
    </div>

    <a class="logout" th:href="@{/logout}">Sair</a>

    <div class="modal" id="modal">
        <div class="modal-card">
            <button class="close" onclick="fecharDetalhes()">×</button>
            <div class="modal-header">
                <div class="avatar">👤</div>
                <span id="m-medico"></span>
            </div>
            <div class="price" id="m-valor"></div>
            <div class="date-time">
                <span id="m-data"></span>
                <span id="m-hora"></span>
            </div>
            <div class="status">Status: <span id="m-status"></span></div>

            <div class="actions">
                <a id="btn-remarcar" class="btn secondary">Remarcar</a>
                <form id="form-cancelar" method="post">
                    <button class="btn danger" type="submit"
                            onclick="return confirm('Deseja realmente cancelar esta consulta?')">
                        Cancelar Consulta
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
