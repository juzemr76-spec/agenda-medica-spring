<!DOCTYPE html>

<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title th:text="${consulta.id == null ? 'Nova Consulta - Agenda Médica' : 'Editar Consulta - Agenda Médica'}">
    Nova Consulta - Agenda Médica
</title>

<link rel="stylesheet" th:href="@{/css/style.css}">


</head>

<body>

<div class="phone">


<header class="topo">

    <div>
        <h1 th:text="${consulta.id == null ? 'Nova Consulta' : 'Editar Consulta'}">
            Nova Consulta
        </h1>

        <p>Preencha os dados do agendamento</p>
    </div>

    <a th:href="@{/consultas}" class="btn-voltar">←</a>

</header>

<main class="conteudo">

    <div class="cabecalho-pagina">

        <div>
            <h2 th:text="${consulta.id == null ? 'Agendar consulta' : 'Editar consulta'}">
                Agendar consulta
            </h2>

            <p>
                Informe os dados do atendimento
            </p>
        </div>

    </div>

    <form th:action="@{/consultas/salvar}"
          th:object="${consulta}"
          method="post"
          class="formulario">

        <!-- ID DA CONSULTA -->
        <input type="hidden"
               th:field="*{id}">

        <!-- PACIENTE -->
        <div class="campo-formulario">

            <label for="paciente">
                Paciente
            </label>

            <select id="paciente"
                    name="paciente.id"
                    required>

                <option value="">
                    Selecione o paciente
                </option>

                <option th:each="paciente : ${pacientes}"
                        th:value="${paciente.id}"
                        th:text="${paciente.nome}"
                        th:selected="${consulta.paciente != null and consulta.paciente.id == paciente.id}">
                </option>

            </select>

        </div>

        <!-- DATA -->
        <div class="campo-formulario">

            <label for="data">
                Data da consulta
            </label>

            <input type="date"
                   id="data"
                   th:field="*{data}"
                   required>

        </div>

        <!-- HORÁRIO -->
        <div class="campo-formulario">

            <label for="horario">
                Horário
            </label>

            <input type="time"
                   id="horario"
                   th:field="*{horario}"
                   required>

        </div>

        <!-- ESPECIALIDADE -->
        <div class="campo-formulario">

            <label for="especialidade">
                Especialidade
            </label>

            <input type="text"
                   id="especialidade"
                   th:field="*{especialidade}"
                   placeholder="Ex.: Clínica Geral"
                   required>

        </div>

        <!-- PROFISSIONAL -->
        <div class="campo-formulario">

            <label for="profissional">
                Profissional
            </label>

            <input type="text"
                   id="profissional"
                   th:field="*{profissional}"
                   placeholder="Nome do médico ou profissional"
                   required>

        </div>

        <!-- STATUS -->
        <div class="campo-formulario">

            <label for="status">
                Status
            </label>

            <select id="status"
                    th:field="*{status}">

                <option value="Agendada">
                    Agendada
                </option>

                <option value="Confirmada">
                    Confirmada
                </option>

                <option value="Realizada">
                    Realizada
                </option>

                <option value="Cancelada">
                    Cancelada
                </option>

                <option value="Faltou">
                    Faltou
                </option>

            </select>

        </div>

        <!-- OBSERVAÇÃO -->
        <div class="campo-formulario">

            <label for="observacao">
                Observação
            </label>

            <textarea id="observacao"
                      th:field="*{observacao}"
                      rows="4"
                      placeholder="Digite alguma observação sobre a consulta...">
            </textarea>

        </div>

        <!-- BOTÕES -->
        <div class="acoes-formulario">

            <a th:href="@{/consultas}"
               class="btn-cancelar">
                Cancelar
            </a>

            <button type="submit"
                    class="btn-salvar">
                💾 Salvar consulta
            </button>

        </div>

    </form>

</main>

<nav class="menu-inferior">

    <a th:href="@{/}">
        <span>⌂</span>
        <small>Início</small>
    </a>

    <a th:href="@{/pacientes}">
        <span>👤</span>
        <small>Pacientes</small>
    </a>

    <a th:href="@{/consultas}" class="ativo">
        <span>📅</span>
        <small>Consultas</small>
    </a>

</nav>


</div>

</body>
</html>
